name: BuildHFImage

on:
  push:
    branches: [ develop ]
    paths:
      - 'Python/Dockerfile'
      - 'Python/app.py'
      - 'Python/index.html'
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop 

      - name: LoginToGitHubContainerRegistry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: SetupDockerBuildx
        uses: docker/setup-buildx-action@v3
      
      - name: SetLowercaseRepositoryOwner
        run: |
          # 将 repository_owner 转换为小写并设置为环境变量
          echo "LOWERCASE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      
      - name: BuildAndPushDockerImage
        uses: docker/build-push-action@v5
        with:
          context: Python/  # Python目录下
          push: true
          tags: |
            ghcr.io/${{ env.LOWERCASE_OWNER }}/hfs:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=http server
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
